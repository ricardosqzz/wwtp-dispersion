name: Publicar visualizador
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Reunir o site
        run: |
          mkdir -p _site/codigos
          cp -a docs/. _site/
          cp -a documentacao/codigos/. _site/codigos/
          sed -i 's@../../docs/@../@g' _site/codigos/index.html
          sed -i 's@../documentacao/codigos/@codigos/@g' _site/index.html
          if [ -d documentacao/poster ]; then
            mkdir -p _site/poster
            cp -a documentacao/poster/. _site/poster/
          fi
          sed -i 's@../documentacao/poster/@poster/@g' _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Aguardar a disponibilidade do artefato
        run: sleep 20
      - uses: actions/deploy-pages@v4
        id: deployment
